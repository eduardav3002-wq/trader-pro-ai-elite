name: Gerar APK Android v3.0 DEMO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Trader_Pro_AI_Elite_v3_0_Android.zip'
      - '.github/workflows/android_overlay_v30.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Evita android-actions/setup-android@v3, que falhou na execucao anterior.
      # As imagens Ubuntu do GitHub ja incluem o Android SDK.
      - name: Usar SDK Android preinstalado no GitHub
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager nao encontrado em: $SDKMANAGER"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair codigo Android
        shell: bash
        run: |
          set -euo pipefail
          unzip -q 'Trader_Pro_AI_Elite_v3_0_Android.zip' -d "$RUNNER_TEMP/trader-android-v30"
          test -f "$RUNNER_TEMP/trader-android-v30/app/build.gradle"

      - name: Testar logica dos alertas de demonstracao
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/trader-android-v30"
          mkdir -p /tmp/trader-policy
          javac -encoding UTF-8 -d /tmp/trader-policy \
            app/src/main/java/com/traderproaielite/overlaydemo/DemoSignal.java \
            app/src/main/java/com/traderproaielite/overlaydemo/DemoPolicy.java \
            app/src/main/java/com/traderproaielite/overlaydemo/OverlayVisibilityPolicy.java \
            app/src/main/java/com/traderproaielite/overlaydemo/OverlayDisplayMode.java \
            tests/DemoPolicyTest.java \
            tests/OverlayVisibilityPolicyTest.java \
            tests/OverlayDisplayModeTest.java
          java -cp /tmp/trader-policy DemoPolicyTest
          java -cp /tmp/trader-policy OverlayVisibilityPolicyTest
          java -cp /tmp/trader-policy OverlayDisplayModeTest

      - name: Compilar APK de demonstracao
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/trader-android-v30"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Trader-Pro-AI-Elite-Android-v3.0-DEMO
          path: ${{ runner.temp }}/trader-android-v30/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
