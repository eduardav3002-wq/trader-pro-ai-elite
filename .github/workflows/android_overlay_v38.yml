name: Gerar APK Android v3.8 DEMO
on:
  workflow_dispatch:
  push:
    paths:
      - 'Trader_Pro_AI_Elite_v3_8_Android.zip'
      - '.github/workflows/android_overlay_v38.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto
        run: unzip -q Trader_Pro_AI_Elite_v3_8_Android.zip -d android_v38
      - name: Testar políticas Java
        working-directory: android_v38
        run: |
          mkdir -p /tmp/trader-tests
          D=app/src/main/java/com/traderproaielite/overlaydemo
          javac --release 17 -d /tmp/trader-tests "$D"/{BridgeFailure,BridgeMonitorPolicy,BridgeRecoveryPolicy,BridgeReliability,DemoBridgePolicy,DemoPolicy,DemoSignal,OverlayDisplayMode,OverlayVisibilityPolicy,HistoryRecoveryPolicy}.java tests/*.java
          for f in tests/*.java; do java -cp /tmp/trader-tests "$(basename "$f" .java)" || exit 1; done
      - name: Compilar APK DEMO
        working-directory: android_v38
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Trader-Pro-AI-Elite-Android-v3.8-DEMO
          path: android_v38/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
